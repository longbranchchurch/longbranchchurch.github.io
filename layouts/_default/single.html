{{ define "main" }}
<section class="page-hero">
  <div class="wrap">
    {{ with .Params.eyebrow }}<p class="eyebrow eyebrow-light">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="page-hero-sub">{{ . }}</p>{{ end }}
  </div>
</section>
<div class="wrap page-body{{ with .Params.width }} page-{{ . }}{{ end }}">
  <div class="prose">
    {{ .Content }}
  </div>
</div>
{{ end }}

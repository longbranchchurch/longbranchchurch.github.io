<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "" | relURL }}" aria-label="Long Branch Church home">
      <img src="{{ "img/brand/lbc-horizontal-color.png" | relURL }}" alt="Long Branch Church" width="900" height="369">
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="sr-only">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        {{- $external := hasPrefix .URL "http" }}
        <li>
          <a href="{{ .URL | relURL }}"{{ if $external }} target="_blank" rel="noopener"{{ end }}{{ if eq (.URL | relURL) $current.RelPermalink }} aria-current="page"{{ end }}>{{ .Name }}</a>
        </li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
